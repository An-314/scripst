[package]
name = "scripst"
version = "1.2.0"
entrypoint = "src/main.typ"
authors = ["AnZreww <an112358132134@gmail.com>", "Allenwang233 <wylin7@126.com>"]
license = "MIT"
description = "Scripst - A versatile scripting template for polished articles, reports, books, and presentations. 🚀"
homepage = "https://an-314.github.io/scripst"
repository = "https://github.com/An-314/scripst"
categories = ["layout", "report", "presentation"]
keywords = ["scripst", "template", "article", "report", "book", "beamer", "slides"]
compiler = "0.15.0"
exclude = ["/docs/*", "/previews/*", "/tests/*", "makefile"]

[template]
path = "template"
entrypoint = "main.typ"
thumbnail = "thumbnail.png"
